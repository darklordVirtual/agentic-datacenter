name: Gate result
description: Share a result card from your own governance gate run on Agentic-Datacenter.
title: "Gate result: <gate> on <scenarios>"
labels: ["gate-result"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for running your gate on Agentic-Datacenter. See docs/guides/bring-your-own-gate.md.
        A result card is a simulation result, not a claim about any facility.
        A result shared here is published as **self-reported**: you ran it, not the maintainers. See "Verified and self-reported results" in docs/bench/PUBLIC_TEST.md.
  - type: input
    id: gate
    attributes:
      label: Gate and version
      description: Name, version or commit, and how it was attached (Python entry point, http_gate or command_gate).
    validations:
      required: true
  - type: input
    id: agentic-datacenter
    attributes:
      label: Agentic-Datacenter version
      description: The tag of the season's benchmark version (benchmark-v1.7 today) or the commit the card was made with.
    validations:
      required: true
  - type: textarea
    id: checked
    attributes:
      label: What was checked
      description: Scenarios, agents, seeds, operating profile, the gates run beside yours, and the output of `agentic-datacenter gate check` and `agentic-datacenter bench check`.
    validations:
      required: true
  - type: textarea
    id: by-whom
    attributes:
      label: By whom
      description: Who ran it, and whether the same people wrote the gate.
    validations:
      required: true
  - type: textarea
    id: supports
    attributes:
      label: What it supports
      description: Which figures, on which runs. Say if it is a development run (unfrozen benchmark).
    validations:
      required: true
  - type: textarea
    id: forge
    attributes:
      label: Could the gate forge or suppress evidence?
      description: Agentic-Datacenter keeps decision records and computes the figures itself. Say what your gate logs on its own and whether anyone but the gate can check it.
    validations:
      required: true
  - type: dropdown
    id: capture
    attributes:
      label: Live or reconstructed
      options:
        - The card was written by the run itself
        - The card was rebuilt afterwards
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: How your terms map to Agentic-Datacenter's
      description: For verdict, authorization, premise, approval and outcome, an exact, partial (say what differs) or no match.
  - type: textarea
    id: files
    attributes:
      label: Result card and evidence
      description: Attach result_card.json and at least one evidence bundle, or link to them.
    validations:
      required: true
