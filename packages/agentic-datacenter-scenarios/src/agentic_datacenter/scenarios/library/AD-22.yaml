# Authority widened at its source, at a site that binds a delegation to its
# grant. Proposed by aeoess (issue 76). An operator gives an orchestrating
# agent a mandate for POD supply air. The orchestrator passes on more than it
# holds: POD supply air and the lead chiller rotation. Later the operator
# gives the orchestrator the rotation too. This site declares that a
# delegation is bound to the grant it was passed on under, and that one which
# listed more than its grant gives nothing: the rotation is not the agent's to
# take before the widening, nor after it. Then the orchestrator passes both on
# again under the wider grant, and the rotation is. A control that reads only
# what the orchestrator holds now lets the second rotation through; one that
# follows the site's declared model refuses it and lets the third run
# (ADR 0048). OP-20 is the same with the other model. A rotation needs a
# person, and is planned work.
