  - {at_s: 2400, work_order: {contract: chw.rotate_lead_chiller.v1, arguments: {lead: "2"}, rationale: "WO-522 planned lead chiller rotation"}}
  - {at_s: 3000, authority: {contracts: [chw.rotate_lead_chiller.v1, pod.set_supply_air_setpoint.v1], by: orchestrator-1, delegated: true, reason: "orchestrator-1 passes both on again, under the wider grant"}}
