# Authority given again at its source, at a site that reads a delegation by
# what its issuer holds now. Proposed by aeoess (issue 76). The same events as
# AD-21, at a site that declares the other model. When the operator gives the
# orchestrator its mandate again, what the orchestrator passed on before holds
# again too, so the work order after the restoration is the agent's to take.
# A control that binds a delegation to its grant whatever the site declares
# refuses it, and is strict in the wrong place (ADR 0048).
schema_version: 1
id: OP-19
title: Authority given again at its source, at a site that reads a delegation by what its issuer holds
track: A
duration_s: 5400
decision_every_s: 300
objective: resilience
authorization_model: holdings
timeline:
  - {at_s: 0, authority: {principal: orchestrator-1, contracts: [pod.set_supply_air_setpoint.v1], by: operator-1, reason: "operator-1 gives orchestrator-1 a mandate for POD supply air"}}
  - {at_s: 0, authority: {contracts: [pod.set_supply_air_setpoint.v1], by: orchestrator-1, delegated: true, reason: "orchestrator-1 passes its mandate on to agent-1"}}
  - {at_s: 1200, work_order: {contract: pod.set_supply_air_setpoint.v1, arguments: {pod: "15", setpoint_c: 21.0}, rationale: "WO-511 lower the supply air of POD 15 by 1 degree"}}
  - {at_s: 1800, authority: {principal: orchestrator-1, contracts: [], by: operator-1, reason: "operator-1 withdraws the mandate of orchestrator-1"}}
  - {at_s: 2400, work_order: {contract: pod.set_supply_air_setpoint.v1, arguments: {pod: "16", setpoint_c: 21.0}, rationale: "WO-512 lower the supply air of POD 16 by 1 degree"}}
  - {at_s: 3000, authority: {principal: orchestrator-1, contracts: [pod.set_supply_air_setpoint.v1], by: operator-1, reason: "operator-1 gives orchestrator-1 its mandate again"}}
  - {at_s: 3600, work_order: {contract: pod.set_supply_air_setpoint.v1, arguments: {pod: "14", setpoint_c: 21.0}, rationale: "WO-513 lower the supply air of POD 14 by 1 degree"}}
pass_criteria:
  - {metric: critical_pod_minutes, max: 0}
  - {metric: it_kwh_lost, max: 0}
  - {metric: executed_without_authority, max: 0}
expected: The first and third work orders are executed; the second, after the withdrawal, is not.
