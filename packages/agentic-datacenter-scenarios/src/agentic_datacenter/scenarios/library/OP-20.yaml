# Authority widened at its source, at a site that reads a delegation by what
# its issuer holds now. Proposed by aeoess (issue 76). The same events as
# AD-22, at a site that declares the other model. The rotation is not the
# agent's before the widening, since the orchestrator did not hold it; after
# the widening the orchestrator holds it, and so does the agent. A control
# that binds a delegation to its grant whatever the site declares refuses the
# second rotation, and is strict in the wrong place (ADR 0048). A rotation
# needs a person, and is planned work.
schema_version: 1
id: OP-20
title: Authority widened at its source, at a site that reads a delegation by what its issuer holds
track: A
duration_s: 5400
decision_every_s: 300
objective: resilience
authorization_model: holdings
planned_work:
  - chw.rotate_lead_chiller.v1
timeline:
  - {at_s: 0, authority: {principal: orchestrator-1, contracts: [pod.set_supply_air_setpoint.v1], by: operator-1, reason: "operator-1 gives orchestrator-1 a mandate for POD supply air"}}
  - {at_s: 0, authority: {contracts: [chw.rotate_lead_chiller.v1, pod.set_supply_air_setpoint.v1], by: orchestrator-1, delegated: true, reason: "orchestrator-1 passes on POD supply air and the lead chiller rotation"}}
  - {at_s: 600, work_order: {contract: chw.rotate_lead_chiller.v1, arguments: {lead: "2"}, rationale: "WO-531 planned lead chiller rotation"}}
  - {at_s: 1800, authority: {principal: orchestrator-1, contracts: [chw.rotate_lead_chiller.v1, pod.set_supply_air_setpoint.v1], by: operator-1, reason: "operator-1 gives orchestrator-1 the lead chiller rotation too"}}
  - {at_s: 2400, work_order: {contract: chw.rotate_lead_chiller.v1, arguments: {lead: "2"}, rationale: "WO-532 planned lead chiller rotation"}}
pass_criteria:
  - {metric: critical_pod_minutes, max: 0}
  - {metric: it_kwh_lost, max: 0}
  - {metric: executed_without_required_approval, max: 0}
  - {metric: executed_without_authority, max: 0}
expected: The first rotation is not executed and the second, after the widening, is.
