# SPDX-License-Identifier: MIT
#
# Test your governance gate against Agentic-Datacenter on every change, and every
# week against its newest scenarios. Copy this file into .github/workflows/ of
# your own repository and change the four lines marked "yours".
#
# It runs two tracks:
#   stable   a frozen benchmark version, for figures that compare with everyone's
#   canary   the main branch, with the newest scenarios and models, to see early
#            what is coming. A canary that fails does not fail your build.
# and on each it says where your gate did worse than on its previous run.
#
# On a pull request and on a push it runs four scenarios, which takes minutes.
# Every Monday, and when you start it by hand, it runs the whole quick benchmark.
#
# It needs no key and no account, sends nothing anywhere, and puts nothing of
# Agentic-Datacenter into your repository: it checks it out beside yours.
#
# Each run gives you, as a build artifact and on the run's summary page:
#   summary.md        your gate's figures in plain words, beside the built-in gates
#   report.html       the same as a page
#   result_card.json  every figure and every run
#   decisions.jsonl   each decision with your reasons and its correlation
# and it fails when your gate let a harmful step through (bench check), when a
# receipt you exported does not match the run (gate verify-receipts), or when a
# figure is worse than on the previous run of the same track (bench compare).

name: agentic-datacenter

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays: the newest scenarios on Agentic-Datacenter's main
  workflow_dispatch:

permissions:
  contents: read

env:
  # The frozen version the stable track runs: the tag of the season that is open,
  # from https://github.com/agentic-datacenter/agentic-datacenter/blob/main/docs/bench/PUBLIC_TEST.md
  # Figures made on a tag can be made again by anyone.
  ADC_STABLE_REF: benchmark-v1.7
  # yours: how your gate is run, as a command per decision (or use ADC_GATE_URL for a
  # service you start in a step before the checks). As given it runs the MIT starter,
  # so the workflow is green before you change anything.
  ADC_GATE_COMMAND: python ${{ github.workspace }}/adc/examples/command-gate/adapter.py
  ADC_GATE_NAME: my_gate # yours: the name on the card
  ADC_GATE_CONTEXT: "1" # yours: 1 to be sent a read-only sample of the plant
  ADC_RECEIPTS_FILE: ${{ github.workspace }}/receipts.jsonl # yours: where you write receipts, if you do

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        track: [stable, canary]
    # What is new on main may be ahead of your gate. It is reported, and does not stop you.
    continue-on-error: ${{ matrix.track == 'canary' }}
    env:
      ADC_REF: ${{ matrix.track == 'stable' && 'benchmark-v1.7' || 'main' }}
      # short: four scenarios on every change. full: every scenario, weekly and on request.
      ADC_SCOPE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'short' }}
      # yours: the scenarios of the short run. One of plant operation, three of who may act.
      ADC_SHORT: --scenario OP-03 --scenario AD-11 --scenario AD-17 --scenario AD-18
    steps:
      - uses: actions/checkout@v4
        with:
          path: gate
      - uses: actions/checkout@v4
        with:
          repository: agentic-datacenter/agentic-datacenter
          ref: ${{ env.ADC_REF }}
          path: adc
      - uses: astral-sh/setup-uv@v6
      - name: Install Agentic-Datacenter
        working-directory: adc
        run: uv sync
      - name: Interface check
        working-directory: adc
        run: uv run agentic-datacenter gate check command_gate
      - name: One run, with its evidence bundle and receipts
        working-directory: adc
        run: |
          : > "$ADC_RECEIPTS_FILE"  # only this run's receipts, not the interface check's
          uv run agentic-datacenter scenario run OP-03 --gate command_gate --seconds 1800 \
            --out ../result/evidence || echo "the scenario's own criteria were not met; see the bundle"
          if [ -s "$ADC_RECEIPTS_FILE" ]; then
            uv run agentic-datacenter gate verify-receipts ../result/evidence "$ADC_RECEIPTS_FILE"
            : > "$ADC_RECEIPTS_FILE"
          fi
      - name: Quick benchmark beside the built-in gates
        working-directory: adc
        run: |
          if [ "$ADC_SCOPE" = "full" ]; then which=""; else which="$ADC_SHORT"; fi
          uv run agentic-datacenter bench run --tier quick --jobs 4 $which --gate command_gate \
            --gate static_allowlist --gate null_gate --out ../result/bench
      - name: This week's scenarios, on the main branch
        if: matrix.track == 'canary' && env.ADC_SCOPE == 'full'
        working-directory: adc
        run: |
          # Three scenarios drawn for the week from a public beacon; nobody has seen them
          # before its Monday (docs/bench/WEEKLY.md).
          uv run agentic-datacenter weekly run --gate command_gate --gate static_allowlist \
            --out ../result/weekly
      - name: Summary
        if: always()
        run: cat result/bench/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentic-datacenter-${{ matrix.track }}-${{ env.ADC_SCOPE }}-${{ github.run_id }}
          path: result/
      - name: The card of this track's previous run, if there is one
        uses: actions/cache/restore@v4
        with:
          path: previous
          key: agentic-datacenter-card-${{ matrix.track }}-${{ env.ADC_SCOPE }}-${{ github.run_id }}
          restore-keys: agentic-datacenter-card-${{ matrix.track }}-${{ env.ADC_SCOPE }}-
      - name: Where the gate did worse than last time
        working-directory: adc
        run: |
          if [ -f ../previous/result_card.json ]; then
            uv run agentic-datacenter bench compare ../previous/result_card.json \
              ../result/bench/result_card.json --gate command_gate | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no earlier card of this track yet: the next run is compared with this one"
          fi
      - name: Keep this card for the next run to be compared with
        if: github.event_name != 'pull_request'
        run: mkdir -p previous && cp result/bench/result_card.json previous/result_card.json
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: previous
          key: agentic-datacenter-card-${{ matrix.track }}-${{ env.ADC_SCOPE }}-${{ github.run_id }}
      - name: Refuse a harmful step let through
        working-directory: adc
        run: uv run agentic-datacenter bench check ../result/bench/result_card.json --gate command_gate
